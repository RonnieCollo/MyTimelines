<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ddd;
}

#toolbar {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    gap: 5px;
}

#toolbar button {
    width: 42px;
    height: 42px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#viewport {
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: grab;
}

#viewport:active {
    cursor: grabbing;
}

#image {
    transform-origin: top left;
    user-select: none;
    width: fit-content;
    height: fit-content;
}

/* Raster images: prevent native browser drag-ghost and text/image selection.
   (Not applied to inline SVG, so links inside it stay clickable.) */
#image img {
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
    display: block;
}

#image svg {
    display: block;
}
</style>
</head>

<body>

<div id="toolbar">
    <button onclick="zoom(1.2)">+</button>
    <button onclick="zoom(1/1.2)">−</button>
    <button onclick="fit()">⌂</button>
    <button onclick="actual()">1:1</button>
</div>

<div id="viewport">
    <div id="image"></div>
</div>

<script>

const params = new URLSearchParams(location.search);
const file = params.get("file") || "";
const imageContainer = document.getElementById("image");

let scale = 1;
let x = 0;
let y = 0;
let naturalWidth = 0;
let naturalHeight = 0;

function update() {
    imageContainer.style.transform =
        `translate(${x}px,${y}px) scale(${scale})`;
}

function zoom(factor) {
    scale *= factor;
    update();
}

function actual() {
    scale = 1;
    x = 0;
    y = 0;
    update();
}

function fit() {

    if (!naturalWidth || !naturalHeight) return;

    scale = Math.min(
        window.innerWidth / naturalWidth,
        window.innerHeight / naturalHeight
    );

    x = (window.innerWidth - naturalWidth * scale) / 2;
    y = (window.innerHeight - naturalHeight * scale) / 2;

    update();
}

function onContentReady() {
    // Measure the loaded content at scale 1 before any transform is applied.
    imageContainer.style.transform = 'translate(0px,0px) scale(1)';
    const rect = imageContainer.getBoundingClientRect();
    naturalWidth = rect.width;
    naturalHeight = rect.height;
    fit();
}

if (file.toLowerCase().endsWith(".svg")) {
    // Fetch and inline the SVG so it stays in this document (links, <a>,
    // clickable). Loading SVG via <img> disables all interactivity.
    fetch(file)
        .then(r => {
            if (!r.ok) throw new Error("Failed to load SVG: " + r.status);
            return r.text();
        })
        .then(svgText => {
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgText, "image/svg+xml");

            const parseError = svgDoc.querySelector("parsererror");
            if (parseError) throw new Error("SVG parse error");

            const svgEl = document.importNode(svgDoc.documentElement, true);

            // Ensure links open a new tab rather than replacing this viewer.
            svgEl.querySelectorAll("a").forEach(a => {
                if (!a.getAttribute("target")) {
                    a.setAttribute("target", "_blank");
                }
            });

            imageContainer.appendChild(svgEl);
            onContentReady();
        })
        .catch(err => {
            console.error(err);
            imageContainer.textContent = "Failed to load SVG.";
        });
} else {
    const img = document.createElement("img");
    img.draggable = false;
    img.onload = onContentReady;
    img.onerror = () => {
        imageContainer.textContent = "Failed to load image.";
    };
    img.src = file;
    imageContainer.appendChild(img);
}

window.addEventListener("resize", fit);

let dragging = false;
let startX;
let startY;

const viewport = document.getElementById("viewport");

viewport.addEventListener("mousedown", e => {

    dragging = true;

    startX = e.clientX - x;
    startY = e.clientY - y;

});

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", e => {

    if (!dragging) return;

    x = e.clientX - startX;
    y = e.clientY - startY;

    update();

});

viewport.addEventListener("wheel", e => {

    e.preventDefault();

    const rect = viewport.getBoundingClientRect();

    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const oldScale = scale;

    scale *= e.deltaY < 0 ? 1.1 : 1/1.1;

    x = mx - (mx - x) * (scale / oldScale);
    y = my - (my - y) * (scale / oldScale);

    update();

});

</script>

</body>
</html>
