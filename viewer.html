<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ddd;
}

#toolbar {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    gap: 5px;
}

#toolbar button {
    width: 42px;
    height: 42px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#viewport {
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: grab;
}

#viewport:active {
    cursor: grabbing;
}

#image {
    transform-origin: top left;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="toolbar">
    <button onclick="zoom(1.2)">+</button>
    <button onclick="zoom(1/1.2)">−</button>
    <button onclick="fit()">⌂</button>
    <button onclick="actual()">1:1</button>
</div>

<div id="viewport">
    <img id="image">
</div>

<script>

const params = new URLSearchParams(location.search);

const img = document.getElementById("image");
img.src = params.get("file");

let scale = 1;
let x = 0;
let y = 0;

function update() {
    img.style.transform =
        `translate(${x}px,${y}px) scale(${scale})`;
}

function zoom(factor) {
    scale *= factor;
    update();
}

function actual() {
    scale = 1;
    x = 0;
    y = 0;
    update();
}

function fit() {

    scale = Math.min(
        window.innerWidth / img.naturalWidth,
        window.innerHeight / img.naturalHeight
    );

    x = (window.innerWidth - img.naturalWidth * scale)/2;
    y = (window.innerHeight - img.naturalHeight * scale)/2;

    update();
}

img.onload = fit;

window.addEventListener("resize", fit);

let dragging = false;
let startX;
let startY;

const viewport = document.getElementById("viewport");

viewport.addEventListener("mousedown", e => {

    dragging = true;

    startX = e.clientX - x;
    startY = e.clientY - y;

});

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", e => {

    if (!dragging) return;

    x = e.clientX - startX;
    y = e.clientY - startY;

    update();

});

viewport.addEventListener("wheel", e => {

    e.preventDefault();

    const rect = viewport.getBoundingClientRect();

    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const oldScale = scale;

    scale *= e.deltaY < 0 ? 1.1 : 1/1.1;

    x = mx - (mx - x) * (scale / oldScale);
    y = my - (my - y) * (scale / oldScale);

    update();

});

</script>

</body>
</html>
