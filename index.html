<meta charset="UTF-8">
<title>MyTimelines</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#sidebar {
    width: 540px;
    min-width: 150px;
    max-width: 600px;
    overflow-y: auto;
    border-right: 1px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
    font-size: 0.9em;
}

#divider {
    width: 5px;
    cursor: col-resize;
    background-color: #ddd;
}

#content {
    flex: 1;
    border: none;
}

#search-box {
    margin: 8px 0 12px 0;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
}

#search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: 0.95em;
    border: 1px solid #bbb;
    border-radius: 4px;
}

#search-input:focus {
    outline: none;
    border-color: #0645AD;
}

mark {
    background: #ffe066;
    color: inherit;
    padding: 0;
    border-radius: 2px;
}

ul {
    list-style-type: none;
    padding-left: 20px;
    margin: 0;
}

li {
    margin: 3px 0;
}

.folder {
    cursor: pointer;
    font-weight: bold;
}

.folder::before {
    content: "▶ ";
    display: inline-block;
    width: 1em;
}

.folder.expanded::before {
    content: "▼ ";
}

a {
    text-decoration: none;
    color: #0645AD;
}

a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div id="sidebar">
    <h2>MyTimelines</h2>

    <div id="search-box">
        <input
            type="text"
            id="search-input"
            placeholder="Search bookmarks..."
            autocomplete="off">
    </div>

    <div id="bookmarks"></div>
</div>

<div id="divider"></div>

<iframe id="content" src=""></iframe>


<script>

// ------------------------------------------------------------
// Recursive function to build bookmarks tree
// ------------------------------------------------------------

function parseDL(dl) {

    const ul = document.createElement('ul');

    Array.from(dl.children).forEach(dt => {

        if (dt.tagName !== 'DT') return;

        const folder = dt.querySelector('H3');
        const bookmark = dt.querySelector('A');


        // ----------------------------------------------------
        // Folder
        // ----------------------------------------------------

        if (folder) {

            const li = document.createElement('li');

            const span = document.createElement('span');

            const folderText = folder.textContent;

            span.textContent = folderText;
            span.className = 'folder';
            span.dataset.text = folderText;
            span.dataset.title = folderText.toLowerCase();


            span.addEventListener('click', () => {

                span.classList.toggle('expanded');

                const childUl =
                    li.querySelector(':scope > ul');

                if (childUl) {
                    childUl.style.display =
                        childUl.style.display === 'none'
                            ? 'block'
                            : 'none';
                }

            });


            li.appendChild(span);


            const nestedDL = dt.querySelector('DL');

            if (nestedDL) {

                const childUl = parseDL(nestedDL);

                childUl.style.display = 'none';

                li.appendChild(childUl);
            }


            ul.appendChild(li);


        // ----------------------------------------------------
        // Bookmark
        // ----------------------------------------------------

        } else if (bookmark) {

            const li = document.createElement('li');

            const a = document.createElement('a');

            const linkText = bookmark.textContent;

            a.href = bookmark.href;
            a.textContent = linkText;

            a.dataset.text = linkText;
            a.dataset.title = linkText.toLowerCase();
            a.dataset.url = bookmark.href.toLowerCase();


            a.addEventListener('click', (e) => {

                e.preventDefault();

                const url = bookmark.href.toLowerCase();


                // SVG and PNG files open in viewer.html
                if (
                    url.endsWith(".svg") ||
                    url.endsWith(".png")
                ) {

                    document.getElementById('content').src =
                        "viewer.html?file=" +
                        encodeURIComponent(bookmark.href);

                } else {

                    // Other links open directly in iframe
                    document.getElementById('content').src =
                        bookmark.href;
                }

            });


            li.appendChild(a);

            ul.appendChild(li);
        }

    });

    return ul;
}


// ------------------------------------------------------------
// Load bookmarks HTML
// ------------------------------------------------------------

fetch('bookmarks.html')

.then(response => response.text())

.then(htmlText => {

    const parser = new DOMParser();

    const doc =
        parser.parseFromString(htmlText, 'text/html');


    // --------------------------------------------------------
    // Skip the outer "Bookmarks" folder.
    //
    // bookmarks.html has this structure:
    //
    // Bookmarks
    //     ├── Timelines
    //     ├── Maps
    //     ├── ...
    //
    // We want to start directly with the contents
    // of the outer Bookmarks folder.
    // --------------------------------------------------------

    const rootFolder =
        doc.querySelector('DL > DT > H3');

    const topDL =
        rootFolder
            ? rootFolder.parentElement.querySelector(':scope > DL')
            : null;


    if (topDL) {

        const tree = parseDL(topDL);

        document
            .getElementById('bookmarks')
            .appendChild(tree);
    }

})

.catch(err =>
    console.error('Error loading bookmarks:', err)
);


// ------------------------------------------------------------
// Resizable divider
// ------------------------------------------------------------

const divider =
    document.getElementById('divider');

const sidebar =
    document.getElementById('sidebar');

const content =
    document.getElementById('content');

let isDragging = false;


divider.addEventListener('mousedown', e => {

    isDragging = true;

    document.body.style.cursor =
        'col-resize';
});


document.addEventListener('mousemove', e => {

    if (!isDragging) return;

    let newWidth = e.clientX;

    if (newWidth < 150)
        newWidth = 150;

    if (newWidth > 600)
        newWidth = 600;


    sidebar.style.width =
        newWidth + 'px';

    content.style.width =
        `calc(100% - ${newWidth + 5}px)`;
});


document.addEventListener('mouseup', e => {

    if (isDragging) {

        isDragging = false;

        document.body.style.cursor =
            'default';
    }

});


// ------------------------------------------------------------
// Search functionality
// ------------------------------------------------------------

const searchInput =
    document.getElementById('search-input');

let searchActive = false;


// Escape HTML for highlighting
function escapeHtml(str) {

    const div =
        document.createElement('div');

    div.textContent = str;

    return div.innerHTML;
}


// Highlights every occurrence of query
function applyHighlight(
    el,
    originalText,
    query
) {

    if (!query) {

        el.textContent =
            originalText;

        return;
    }


    const lower =
        originalText.toLowerCase();

    let result = '';
    let i = 0;
    let found = false;


    while (i < originalText.length) {

        const idx =
            lower.indexOf(query, i);


        if (idx === -1) {

            result +=
                escapeHtml(
                    originalText.slice(i)
                );

            break;
        }


        found = true;


        result +=
            escapeHtml(
                originalText.slice(i, idx)
            );


        result +=
            '<mark>' +
            escapeHtml(
                originalText.slice(
                    idx,
                    idx + query.length
                )
            ) +
            '</mark>';


        i =
            idx + query.length;
    }


    if (found) {

        el.innerHTML = result;

    } else {

        el.textContent =
            originalText;
    }
}


// ------------------------------------------------------------
// Save current expanded/collapsed state
// ------------------------------------------------------------

function saveExpandedState() {

    document
        .querySelectorAll('#bookmarks .folder')
        .forEach(span => {

            span.dataset.prevExpanded =
                span.classList.contains(
                    'expanded'
                );
        });
}


// ------------------------------------------------------------
// Restore expanded/collapsed state
// ------------------------------------------------------------

function clearSearch() {

    document
        .querySelectorAll('#bookmarks li')
        .forEach(li => {

            li.style.display = '';
        });


    document
        .querySelectorAll('#bookmarks .folder')
        .forEach(span => {

            const prevExpanded =
                span.dataset.prevExpanded === 'true';


            span.classList.toggle(
                'expanded',
                prevExpanded
            );


            const li =
                span.closest('li');


            const childUl =
                li
                    ? li.querySelector(':scope > ul')
                    : null;


            if (childUl) {

                childUl.style.display =
                    prevExpanded
                        ? 'block'
                        : 'none';
            }


            span.textContent =
                span.dataset.text;
        });


    document
        .querySelectorAll('#bookmarks a')
        .forEach(a => {

            a.textContent =
                a.dataset.text;
        });
}


// ------------------------------------------------------------
// Recursively filter one <li>
// ------------------------------------------------------------

function filterNode(li, query) {

    const a =
        li.querySelector(':scope > a');


    if (a) {

        const isMatch =
            a.dataset.title.includes(query) ||
            a.dataset.url.includes(query);


        li.style.display =
            isMatch ? '' : 'none';


        applyHighlight(
            a,
            a.dataset.text,
            isMatch ? query : ''
        );


        return isMatch;
    }


    const span =
        li.querySelector(
            ':scope > span.folder'
        );


    const childUl =
        li.querySelector(':scope > ul');


    let childMatch = false;


    if (childUl) {

        Array.from(childUl.children)
            .forEach(childLi => {

                if (
                    filterNode(
                        childLi,
                        query
                    )
                ) {
                    childMatch = true;
                }

            });
    }


    const titleMatch =
        span
            ? span.dataset.title.includes(query)
            : false;


    const visible =
        childMatch || titleMatch;


    li.style.display =
        visible ? '' : 'none';


    if (span) {

        if (visible) {

            span.classList.add(
                'expanded'
            );

            if (childUl) {

                childUl.style.display =
                    'block';
            }
        }


        applyHighlight(
            span,
            span.dataset.text,
            titleMatch ? query : ''
        );
    }


    return visible;
}


// ------------------------------------------------------------
// Run search
// ------------------------------------------------------------

function runSearch(query) {

    const topUl =
        document.querySelector(
            '#bookmarks > ul'
        );


    if (!topUl) return;


    Array.from(topUl.children)
        .forEach(li => {

            filterNode(
                li,
                query
            );
        });
}


// ------------------------------------------------------------
// Find first visible link
// ------------------------------------------------------------

function getFirstVisibleLink() {

    const links =
        document.querySelectorAll(
            '#bookmarks a'
        );


    for (const a of links) {

        if (a.offsetParent !== null)
            return a;
    }


    return null;
}


// ------------------------------------------------------------
// Search input
// ------------------------------------------------------------

searchInput.addEventListener(
    'input',
    () => {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (query === '') {

            if (searchActive) {

                clearSearch();

                searchActive = false;
            }

            return;
        }


        if (!searchActive) {

            saveExpandedState();

            searchActive = true;
        }


        runSearch(query);
    }
);


// ------------------------------------------------------------
// Search keyboard shortcuts
// ------------------------------------------------------------

searchInput.addEventListener(
    'keydown',
    (e) => {

        if (e.key === 'Escape') {

            searchInput.value = '';

            searchInput.dispatchEvent(
                new Event('input')
            );

            searchInput.blur();


        } else if (e.key === 'Enter') {

            e.preventDefault();


            const first =
                getFirstVisibleLink();


            if (first)
                first.click();
        }

    }
);

</script>

</body>
</html>
